name: Deploy to GCP
description: |
  Reusable Cloud Run deploy step. Mirrors deploy-production.yml's pattern:
  Workload Identity auth → build & push to Artifact Registry → Cloud Run
  deploy with --no-allow-unauthenticated → grant domain:designfoundry.ai
  the run.invoker binding (two-layer auth, see CLAUDE.md) → emit service URL.

  Caller MUST declare on the job (or workflow):
    permissions:
      contents: read
      id-token: write
  The id-token permission is required for the OIDC token exchange with GCP.

inputs:
  environment_name:
    description: Environment label used in step names / logs (e.g. 'staging' or 'production')
    required: true
  image_tag:
    description: Image tag to build/push/deploy (e.g. the commit SHA)
    required: true
  gcp_project_id:
    description: GCP project ID
    required: true
  gcp_region:
    description: GCP region (e.g. europe-central2)
    required: true
  gcp_workload_identity_provider:
    description: Full WIF provider resource path (projects/N/locations/global/workloadIdentityPools/POOL/providers/PROVIDER)
    required: true
  gcp_deployer_service_account:
    description: GCP service account the workflow impersonates via WIF (the deployer SA)
    required: true
  artifact_registry_repo:
    description: Artifact Registry repository name (e.g. superadmin)
    required: true
  cloud_run_service:
    description: Cloud Run service name to deploy
    required: true
  service_account:
    description: Cloud Run runtime service account (NOT the deployer SA)
    required: true
  next_public_api_url:
    description: Backend API base URL baked into the Next.js client bundle at build time
    required: true
  jwt_secret_name:
    description: Name of the Secret Manager secret bound to JWT_SECRET
    required: false
    default: superadmin-jwt-secret
  extra_env_vars:
    description: |
      Additional --set-env-vars entries, comma-separated KEY=VALUE pairs.
      Concatenated onto the base set (NODE_ENV, NEXT_PUBLIC_API_URL).
      Caveat: values must not contain commas — gcloud splits on comma.
      Newlines and other whitespace are fine. Production passes
      ADMIN_DATABASE_URL, RSA_PRIVATE_KEY, LICENSE_KEY_ID via this input.
    required: false
    default: ""

outputs:
  service_url:
    description: Deployed Cloud Run service URL
    value: ${{ steps.url.outputs.service_url }}

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_deployer_service_account }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ inputs.gcp_project_id }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure Docker auth for Artifact Registry
      shell: bash
      run: |
        gcloud auth configure-docker "${{ inputs.gcp_region }}-docker.pkg.dev" --quiet

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        tags: |
          ${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/${{ inputs.artifact_registry_repo }}/designfoundry-ea-superadmin:${{ inputs.image_tag }}
          ${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/${{ inputs.artifact_registry_repo }}/designfoundry-ea-superadmin:latest
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_API_URL=${{ inputs.next_public_api_url }}

    - name: Deploy to Cloud Run (${{ inputs.environment_name }})
      shell: bash
      env:
        # Pass the user-supplied extras through the env rather than direct
        # template substitution into the run-block, so multi-line secret
        # values (PEM keys, etc.) survive without breaking bash quoting.
        EXTRA_ENV_VARS: ${{ inputs.extra_env_vars }}
      # Two-layer auth (see CLAUDE.md):
      #   Layer 1: Cloud Run IAM — only principals with roles/run.invoker can
      #            hit the service URL. Granted to domain:designfoundry.ai
      #            in the step below (org policy iam.allowedPolicyMemberDomains
      #            forbids the broader allAuthenticatedUsers).
      #   Layer 2: App-level JWT enforces @designfoundry.ai on every request
      #            (src/app/api/auth/login/route.ts).
      # --no-allow-unauthenticated closes the IAM layer.
      run: |
        ENV_VARS="NODE_ENV=production,NEXT_PUBLIC_API_URL=${{ inputs.next_public_api_url }}"
        if [[ -n "${EXTRA_ENV_VARS}" ]]; then
          ENV_VARS="${ENV_VARS},${EXTRA_ENV_VARS}"
        fi

        gcloud run deploy "${{ inputs.cloud_run_service }}" \
          --image="${{ inputs.gcp_region }}-docker.pkg.dev/${{ inputs.gcp_project_id }}/${{ inputs.artifact_registry_repo }}/designfoundry-ea-superadmin:${{ inputs.image_tag }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --platform=managed \
          --service-account="${{ inputs.service_account }}" \
          --set-env-vars="${ENV_VARS}" \
          --set-secrets="JWT_SECRET=${{ inputs.jwt_secret_name }}:latest" \
          --min-instances=0 \
          --max-instances=2 \
          --memory=512Mi \
          --cpu=1 \
          --port=3000 \
          --no-allow-unauthenticated

    - name: Grant Workspace domain run.invoker (idempotent)
      shell: bash
      # Without this, --no-allow-unauthenticated leaves the service with no
      # end-user invoker bindings and the app 403s on every login attempt.
      run: |
        gcloud run services add-iam-policy-binding "${{ inputs.cloud_run_service }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --member="domain:designfoundry.ai" \
          --role="roles/run.invoker" \
          --quiet

    - name: Get Cloud Run URL
      id: url
      shell: bash
      run: |
        URL=$(gcloud run services describe "${{ inputs.cloud_run_service }}" \
          --region="${{ inputs.gcp_region }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --format="value(status.url)")
        echo "service_url=$URL" >> "$GITHUB_OUTPUT"
