name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # Opt in to Node.js 24 for GitHub JavaScript actions. GitHub is migrating
  # from Node 20 → Node 24 on 2026-09-16; setting this flag adopts the new
  # runtime early and silences the deprecation warning that already fires
  # on every Node 20 action invocation.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx next lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
